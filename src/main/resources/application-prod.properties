# Perfil de PRODUCCION. A proposito NO tiene valores por defecto: si falta
# alguna variable de entorno, el arranque falla en vez de usar una
# credencial de desarrollo por accidente.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# En produccion Hibernate NUNCA debe modificar el esquema solo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false