# Configuracion comun a todos los entornos.
# El perfil activo decide de donde salen las credenciales de la base de datos
# (ver application-dev.properties y application-prod.properties).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Puerto de escucha. En local sigue siendo 8080 por defecto.
# Render inyecta su propia variable PORT y la app debe respetarla.
server.port=${PORT:8080}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Configuracion para generar y validar tokens JWT
app.jwt.secret=${JWT_SECRET:alquiler-vehiculos-clave-jwt-segura-2026-cambiar-produccion}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}