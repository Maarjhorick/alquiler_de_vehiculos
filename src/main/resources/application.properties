spring.datasource.url=jdbc:mysql://localhost:3306/alquiler_de_vehiculos?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
# Esto permite que Spring cree las tablas automáticamente basándose en tus clases @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Configuracion para generar y validar tokens JWT
app.jwt.secret=${JWT_SECRET:alquiler-vehiculos-clave-jwt-segura-2026-cambiar-produccion}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
