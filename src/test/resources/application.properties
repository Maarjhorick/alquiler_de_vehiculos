# Configuracion exclusiva para pruebas: usa H2 en memoria en vez de tu
# MySQL real, para que correr los tests nunca toque ni ensucie tus datos.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.jwt.secret=clave-secreta-solo-para-pruebas-junit-no-usar-en-produccion
app.jwt.expiration-ms=3600000